name: JSSR CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java-version }}, Boot ${{ matrix.springboot-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ '17', '21', '25' ]
        springboot-version: [ '3.4.2', '4.0.0' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build & Run Test Suite
        run: ./gradlew test -PspringBootVersion=${{ matrix.springboot-version }} --info
