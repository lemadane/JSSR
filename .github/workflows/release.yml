name: JSSR Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release (${{ github.ref_name }})
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract Tag Version
        id: get_version
        run: echo "TAG_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Verify Spring Boot 3.4.2 Test Suite
        run: ./gradlew test -PspringBootVersion=3.4.2 -Pversion=${TAG_VERSION} --info

      - name: Verify Spring Boot 4.0.0 Test Suite
        run: ./gradlew test -PspringBootVersion=4.0.0 -Pversion=${TAG_VERSION} --info

      - name: Build & Publish Artifacts
        run: ./gradlew build publishToMavenLocal -Pversion=${TAG_VERSION}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
